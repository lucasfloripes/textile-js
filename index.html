<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textile live web editor</title>
  <link rel="stylesheet" href="app.css">
  <script src="textile.js"></script>
</head>
<body>

  <header class="site-header">
    <h1>Textile live web editor</h1>
    <a href="https://github.com/lucasfloripes/textile-js">textile-js on GitHub</a>
  </header>

  <div class="row">
    <div id="col_left" class="col">
      <div class="hd">
        <label for="tx_input">Textile input</label>
        <span class="tools">
          <label class="toggle"><input type="checkbox" id="redmine"> Redmine syntax</label>
          <button class="clear">Clear</button>
        </span>
      </div>
      <textarea id="tx_input" cols="80" rows="20" class="panel"></textarea>
    </div>

    <div id="col_right" class="col">
      <ul class="nav tab hd">
        <li class="current"><a href="#text_preview">Preview</a></li>
        <li><a href="#html_output">HTML Output</a></li>
        <li><a href="#syntax_guide">Syntax Guide</a></li>
      </ul>
      <div id="text_preview" class="panel"></div>
      <textarea id="html_output" class="panel" readonly></textarea>
      <textarea id="syntax_guide" class="panel" readonly></textarea>
    </div>
  </div>

  <footer id="foot">
    Community-maintained fork of <a href="https://github.com/borgar/textile-js">textile-js</a> by Borgar Þorsteinsson.
  </footer>

  <script src="app.js"></script>
</body>
</html>
